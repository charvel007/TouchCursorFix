
name: Build TouchCursorFix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile TouchCursorFix
        shell: msys2 {0}
        run: |
          windres TouchCursorFix.rc -O coff -o TouchCursorFix.res.o
          g++ -O2 -s -municode -mwindows main.cpp TouchCursorFix.res.o -o TouchCursorFix.exe -luser32 -lshell32 -ladvapi32
          sha256sum TouchCursorFix.exe > SHA256SUMS.txt

      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TouchCursorFix-windows
          path: |
            TouchCursorFix.exe
            SHA256SUMS.txt
          if-no-files-found: error
